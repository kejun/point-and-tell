name: macOS Universal build and native tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify committed release archives
        run: |
          python3 scripts/verify-releases.py
          for archive in releases/v*/*.zip; do
            target="$(mktemp -d)"
            ditto -x -k "$archive" "$target"
            codesign --verify --strict --verbose=2 "$target/Point & Tell.app"
            if [[ "$archive" == "releases/v$(cat VERSION)/"* ]]; then
              "$target/Point & Tell.app/Contents/MacOS/PointAndTell" --audio-smoke-test "$PWD/dist/committed-audio-smoke"
              "$target/Point & Tell.app/Contents/MacOS/PointAndTell" --smoke-test "$PWD/dist/committed-ui-smoke"
            fi
            rm -rf "$target"
          done
      - name: Toolchain
        run: swift --version && xcodebuild -version && test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test pure core
        timeout-minutes: 5
        run: swift test --arch ${{ matrix.arch }}
      - name: Build Universal macOS 11 app
        id: package
        run: ARCH=universal scripts/build-app.sh
      - name: Verify native AAC audio chain
        timeout-minutes: 4
        run: '"dist/Point & Tell.app/Contents/MacOS/PointAndTell" --audio-smoke-test "$PWD/dist/audio-smoke"'
      - name: Render native review UI fixture
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 2
        run: '"dist/Point & Tell.app/Contents/MacOS/PointAndTell" --smoke-test "$PWD/dist/ui-smoke"'
      - name: Upload ad-hoc signed app
        uses: actions/upload-artifact@v4
        with:
          name: Point-and-Tell-universal-built-on-${{ matrix.arch }}
          path: |
            dist/Point-and-Tell-v*-macOS-universal.zip
            dist/Point-and-Tell-v*-macOS-universal.zip.sha256
            dist/build.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-smoke-evidence-${{ matrix.arch }}
          path: |
            dist/ui-smoke/*.png
            dist/ui-smoke/timeline.html
            dist/ui-smoke/timeline-bundle/**
            dist/audio-smoke/**/results.json
            dist/committed-audio-smoke/**/results.json
            dist/committed-ui-smoke/window.png
          if-no-files-found: ignore
