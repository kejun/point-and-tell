name: macOS Universal build and native tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify committed release archives
        run: python3 scripts/verify-releases.py
      - name: Toolchain
        run: swift --version && xcodebuild -version && test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Test pure core
        timeout-minutes: 5
        run: swift test --arch ${{ matrix.arch }}
      - name: Build Universal macOS 11 app
        run: ARCH=universal scripts/build-app.sh
      - name: Verify native PCM extraction
        timeout-minutes: 2
        run: '"dist/Point & Tell.app/Contents/MacOS/PointAndTell" --audio-smoke-test "$PWD/dist/audio-smoke"'
      - name: Render native review UI fixture
        timeout-minutes: 2
        run: '"dist/Point & Tell.app/Contents/MacOS/PointAndTell" --smoke-test "$PWD/dist/ui-smoke"'
      - name: Upload ad-hoc signed app
        uses: actions/upload-artifact@v4
        with:
          name: Point-and-Tell-universal-built-on-${{ matrix.arch }}
          path: |
            dist/Point-and-Tell-v*-macOS-universal.zip
            dist/Point-and-Tell-v*-macOS-universal.zip.sha256
            dist/build.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-smoke-evidence-${{ matrix.arch }}
          path: dist/ui-smoke/window.png
          if-no-files-found: ignore
