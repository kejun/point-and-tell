name: macOS Intel build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test pure core
        timeout-minutes: 5
        run: swift test
      - name: Build Intel macOS 11 app
        run: ARCH=x86_64 scripts/build-app.sh
      - name: Verify native PCM extraction
        timeout-minutes: 2
        run: '"dist/Point & Tell.app/Contents/MacOS/PointAndTell" --audio-smoke-test "$PWD/dist/audio-smoke"'
      - name: Render native review UI fixture
        timeout-minutes: 2
        run: '"dist/Point & Tell.app/Contents/MacOS/PointAndTell" --smoke-test "$PWD/dist/ui-smoke"'
      - name: Upload ad-hoc signed app
        uses: actions/upload-artifact@v4
        with:
          name: Point-and-Tell-macOS-x86_64
          path: |
            dist/Point-and-Tell-v*-macOS-x86_64.zip
            dist/Point-and-Tell-v*-macOS-x86_64.zip.sha256
            dist/build.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-smoke-evidence
          path: dist/ui-smoke/window.png
          if-no-files-found: ignore
